[program:expo]
; RM1.17-S+ — Fix "Expo offline" ricorrente.
; Wrapper dedicato `/usr/local/bin/start-expo.sh` che:
;   - fuser -k 3000/tcp e pkill expo/metro PRE-start → elimina orfani che
;     tenevano il porto (root cause "EADDRINUSE + prompt stdin closed")
;   - lancia `npx expo start --port 3000` in exec con HMR attivo (senza
;     CI=1, che disabiliterebbe watch/reload in Metro).
; stopasgroup/killasgroup=true → stop supervisor uccide l'intero tree
; (bash wrapper → npm exec → node → metro worker) evitando orfani.
command=/usr/local/bin/start-expo.sh
directory=/app/frontend
autostart=true
autorestart=true
startretries=10
startsecs=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/supervisor/expo.out.log
stderr_logfile=/var/log/supervisor/expo.err.log
environment=NODE_ENV="development",BROWSER="none",EXPO_PACKAGER_PROXY_URL="https://game-portal-327.preview.emergentagent.com",EXPO_PACKAGER_HOSTNAME="https://game-portal-327.preview.emergentagent.com"
