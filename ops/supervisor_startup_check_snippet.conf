; OPS-C-SUPERVISOR-WIRING — Supervisor snippet for startup_check oneshot.
;
; This snippet is DESIGN-ONLY by default. It is NOT applied automatically
; by V10; the user must explicitly approve the apply step before the
; oneshot is wired into /etc/supervisor/conf.d/.
;
; The startup_check oneshot is idempotent and only restores
; /usr/local/bin/start-expo.sh if it is missing or has drifted from the
; persistent copy at /app/ops/start-expo.sh.

[program:startup_check]
command=bash /app/ops/startup_check.sh
autostart=true
autorestart=false
startsecs=0
priority=10
stdout_logfile=/var/log/supervisor/startup_check.out.log
stderr_logfile=/var/log/supervisor/startup_check.err.log
environment=PYTHONUNBUFFERED="1"
